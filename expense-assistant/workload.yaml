apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: expense-assistant

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: expense-claim-whu-3db9ee43
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: expense-claim-whu-668c881f
      envBindings:
        dbname: EXPENSE_ASSISTANT_DB_DBNAME
        host: EXPENSE_ASSISTANT_DB_HOST
        password: EXPENSE_ASSISTANT_DB_PASSWORD
        port: EXPENSE_ASSISTANT_DB_PORT
        user: EXPENSE_ASSISTANT_DB_USER
