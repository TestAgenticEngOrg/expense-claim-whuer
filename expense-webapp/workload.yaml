apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: expense-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: expense-claim-whuer-expense-api
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_API_URL
    - component: expense-claim-whuer-expense-assistant
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_ASSISTANT_URL
  resources:
    - ref: expense-claim-whu-3db9ee43
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
