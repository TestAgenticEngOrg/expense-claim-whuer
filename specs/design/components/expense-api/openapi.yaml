openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Expense claims and the team's weekly limit.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:submit: Create and send a claim
            claims:review-team: The caller's team's claims
            claims:approve: Approve a submitted claim in the caller's team
            claims:reject: Reject a submitted claim in the caller's team
            weekly-limit:read: The caller's team's weekly limit
            weekly-limit:set: Set the caller's team's weekly limit
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    ExpenseClaim:
      type: object
      required: [id, employeeId, amount, currency, merchant, expenseDate, category, receiptImageUrl, status, createdAt]
      properties:
        id: { type: string }
        employeeId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string }
        merchant: { type: string }
        expenseDate: { type: string, format: date }
        category: { type: string }
        receiptImageUrl: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        managerComment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    NewExpenseClaim:
      type: object
      required: [amount, currency, merchant, expenseDate, category, receiptImageUrl]
      properties:
        amount: { type: number, format: double }
        currency: { type: string }
        merchant: { type: string }
        expenseDate: { type: string, format: date }
        category: { type: string }
        receiptImageUrl: { type: string }
    ClaimDecision:
      type: object
      properties:
        comment: { type: string, nullable: true }
    WeeklyLimit:
      type: object
      required: [naturalLanguageText, amountPerWeek, currency, updatedAt]
      properties:
        naturalLanguageText: { type: string }
        amountPerWeek: { type: number, format: double }
        currency: { type: string }
        updatedAt: { type: string, format: date-time }
    NewWeeklyLimit:
      type: object
      required: [naturalLanguageText, amountPerWeek, currency]
      properties:
        naturalLanguageText: { type: string }
        amountPerWeek: { type: number, format: double }
        currency: { type: string }
  responses:
    NotFound:
      description: The resource does not exist or is not the caller's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request body is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - oauth2: []
paths:
  /me/expense-claims:
    get:
      operationId: listMyExpenseClaims
      summary: The caller's claims
      security:
        - oauth2: [claims:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: A page of the caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: submitExpenseClaim
      summary: Submit a new expense claim
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewExpenseClaim' }
      responses:
        '201':
          description: The claim was created, pending review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/team/expense-claims:
    get:
      operationId: listTeamExpenseClaims
      summary: Every claim submitted by the caller's team
      security:
        - oauth2: [claims:review-team]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: A page of the team's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/team/expense-claims/{claimId}/approve:
    post:
      operationId: approveTeamExpenseClaim
      summary: Approve a claim in the caller's team
      security:
        - oauth2: [claims:approve]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDecision' }
      responses:
        '200':
          description: The claim was approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/expense-claims/{claimId}/reject:
    post:
      operationId: rejectTeamExpenseClaim
      summary: Reject a claim in the caller's team
      security:
        - oauth2: [claims:reject]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDecision' }
      responses:
        '200':
          description: The claim was rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/weekly-limit:
    get:
      operationId: getTeamWeeklyLimit
      summary: The caller's team's weekly limit
      security:
        - oauth2: [weekly-limit:read]
      responses:
        '200':
          description: The team's current weekly limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyLimit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setTeamWeeklyLimit
      summary: Set the caller's team's weekly limit
      security:
        - oauth2: [weekly-limit:set]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewWeeklyLimit' }
      responses:
        '200':
          description: The weekly limit was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyLimit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up
